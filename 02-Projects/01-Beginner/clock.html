<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Project - Master Web Development</title>
    <style>
        /* ========================================
           ROOT VARIABLES
           ======================================== */
        :root {
            --primary: #6c5ce7;
            --dark: #0a0a23;
            --card-bg: #16163a;
            --card-border: #2d2d5e;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #00cec9);
        }

        /* ========================================
           RESET STYLES
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========================================
           BODY STYLES
           ======================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ========================================
           CLOCK CONTAINER
           ======================================== */
        .clock-container {
            text-align: center;
        }

        /* ========================================
           ANALOG CLOCK
           ======================================== */
        .analog-clock {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 8px solid var(--card-border);
            position: relative;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Clock center */
        .center-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Clock hands */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 5px;
        }

        .hour-hand {
            width: 6px;
            height: 70px;
            background: #fff;
            transform: translateX(-50%) rotate(0deg);
        }

        .minute-hand {
            width: 4px;
            height: 100px;
            background: #ccc;
            transform: translateX(-50%) rotate(0deg);
        }

        .second-hand {
            width: 2px;
            height: 120px;
            background: var(--primary);
            transform: translateX(-50%) rotate(0deg);
        }

        /* Clock numbers */
        .clock-number {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .clock-number:nth-child(1) { top: 15px; left: 50%; transform: translateX(-50%); }
        .clock-number:nth-child(2) { top: 35px; right: 40px; }
        .clock-number:nth-child(3) { top: 50%; right: 15px; transform: translateY(-50%); }
        .clock-number:nth-child(4) { bottom: 35px; right: 40px; }
        .clock-number:nth-child(5) { bottom: 15px; left: 50%; transform: translateX(-50%); }
        .clock-number:nth-child(6) { bottom: 35px; left: 40px; }
        .clock-number:nth-child(7) { top: 50%; left: 15px; transform: translateY(-50%); }
        .clock-number:nth-child(8) { top: 35px; left: 40px; }

        /* ========================================
           DIGITAL CLOCK
           ======================================== */
        .digital-clock {
            background: var(--card-bg);
            padding: 30px 50px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--card-border);
        }

        .time {
            font-size: 4rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Consolas', monospace;
        }

        .date {
            color: #888;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* ========================================
           TIMEZONE SELECTOR
           ======================================== */
        .timezone-selector {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .timezone-selector label {
            color: #888;
            margin-right: 10px;
        }

        .timezone-selector select {
            background: var(--dark);
            color: #fff;
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .timezone-selector select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ========================================
           RESPONSIVE DESIGN
           ======================================== */
        @media (max-width: 400px) {
            .analog-clock {
                width: 250px;
                height: 250px;
            }

            .hour-hand { height: 55px; }
            .minute-hand { height: 80px; }
            .second-hand { height: 95px; }

            .time {
                font-size: 2.5rem;
            }

            .digital-clock {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <!-- ========================================
         CLOCK HTML STRUCTURE
         ======================================== -->
    <div class="clock-container">
        <!-- Analog Clock -->
        <div class="analog-clock" id="analogClock">
            <!-- Clock numbers -->
            <div class="clock-number">12</div>
            <div class="clock-number">1</div>
            <div class="clock-number">2</div>
            <div class="clock-number">3</div>
            <div class="clock-number">4</div>
            <div class="clock-number">5</div>
            <div class="clock-number">6</div>
            <div class="clock-number">7</div>
            <div class="clock-number">8</div>
            <div class="clock-number">9</div>
            <div class="clock-number">10</div>
            <div class="clock-number">11</div>

            <!-- Clock hands -->
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            
            <!-- Center dot -->
            <div class="center-dot"></div>
        </div>

        <!-- Digital Clock -->
        <div class="digital-clock">
            <div class="time" id="digitalTime">00:00:00</div>
            <div class="date" id="digitalDate">Loading...</div>
        </div>

        <!-- Timezone Selector -->
        <div class="timezone-selector">
            <label for="timezone">Timezone:</label>
            <select id="timezone">
                <option value="local">Local Time</option>
                <option value="America/New_York">New York (EST)</option>
                <option value="America/Chicago">Chicago (CST)</option>
                <option value="America/Denver">Denver (MST)</option>
                <option value="America/Los_Angeles">Los Angeles (PST)</option>
                <option value="Europe/London">London (GMT)</option>
                <option value="Europe/Paris">Paris (CET)</option>
                <option value="Asia/Tokyo">Tokyo (JST)</option>
                <option value="Asia/Shanghai">Shanghai (CST)</option>
                <option value="Asia/Dubai">Dubai (GST)</option>
                <option value="Australia/Sydney">Sydney (AEST)</option>
            </select>
        </div>
    </div>

    <!-- ========================================
         JAVASCRIPT - Clock Logic
         ======================================== -->
    <script>
        // Get DOM elements
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const digitalTime = document.getElementById('digitalTime');
        const digitalDate = document.getElementById('digitalDate');
        const timezoneSelect = document.getElementById('timezone');

        // Update clock
        function updateClock() {
            // Get current time
            const now = new Date();
            
            // Get timezone
            const timezone = timezoneSelect.value;
            let options;
            
            if (timezone === 'local') {
                options = {};
            } else {
                options = { timeZone: timezone };
            }

            // Get time components
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Calculate rotation angles
            const secondDegrees = (seconds / 60) * 360 + (milliseconds / 1000) * 6;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = ((hours % 12) / 12) * 360 + (minutes / 60) * 30;

            // Apply rotations
            secondHand.style.transform = `translateX(-50%) rotate(${secondDegrees}deg)`;
            minuteHand.style.transform = `translateX(-50%) rotate(${minuteDegrees}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;

            // Update digital clock
            const timeString = now.toLocaleTimeString('en-US', {
                hour12: true,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                ...(timezone !== 'local' ? { timeZone: timezone } : {})
            });
            digitalTime.textContent = timeString;

            // Update date
            const dateString = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                ...(timezone !== 'local' ? { timeZone: timezone } : {})
            });
            digitalDate.textContent = dateString;
        }

        // Update clock every frame for smooth animation
        function animate() {
            updateClock();
            requestAnimationFrame(animate);
        }

        // Start the clock
        animate();

        // Update timezone when changed
        timezoneSelect.addEventListener('change', updateClock);

        // Add hour markers (small lines)
        function addHourMarkers() {
            const clock = document.getElementById('analogClock');
            for (let i = 0; i < 60; i++) {
                const marker = document.createElement('div');
                marker.style.cssText = `
                    position: absolute;
                    width: ${i % 5 === 0 ? '3px' : '1px'};
                    height: ${i % 5 === 0 ? '15px' : '8px'};
                    background: ${i % 5 === 0 ? '#fff' : '#444'};
                    top: 50%;
                    left: 50%;
                    transform-origin: center center;
                    transform: translate(-50%, -140px) rotate(${i * 6}deg);
                `;
                clock.appendChild(marker);
            }
        }

        addHourMarkers();
    </script>
</body>
</html>
