<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Project - Master Web Development</title>
    <style>
        /* ========================================
           ROOT VARIABLES
           ======================================== */
        :root {
            --primary: #6c5ce7;
            --dark: #0a0a23;
            --dark-light: #1a1a3e;
            --card-bg: #16163a;
            --card-border: #2d2d5e;
            --success: #00b894;
            --danger: #d63031;
            --gradient-1: linear-gradient(135deg, #6c5ce7, #00cec9);
        }

        /* ========================================
           RESET STYLES
           ======================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========================================
           BODY STYLES
           ======================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ========================================
           APP CONTAINER
           ======================================== */
        .todo-app {
            width: 100%;
            max-width: 500px;
        }

        /* ========================================
           HEADER STYLES
           ======================================== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
        }

        /* ========================================
           INPUT SECTION STYLES
           ======================================== */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .todo-input {
            flex: 1;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .todo-input:focus {
            border-color: var(--primary);
        }

        .todo-input::placeholder {
            color: #666;
        }

        .add-btn {
            padding: 15px 25px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 92, 231, 0.4);
        }

        /* ========================================
           FILTER BUTTONS STYLES
           ======================================== */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ========================================
           TODO LIST STYLES
           ======================================== */
        .todo-list {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        /* ========================================
           TODO ITEM STYLES
           ======================================== */
        .todo-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--card-border);
            transition: background-color 0.3s ease;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item:hover {
            background: rgba(108, 92, 231, 0.1);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #666;
        }

        /* Checkbox */
        .todo-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--card-border);
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .todo-checkbox:hover {
            border-color: var(--primary);
        }

        .todo-item.completed .todo-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .todo-item.completed .todo-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* Text */
        .todo-text {
            flex: 1;
            color: #fff;
            font-size: 1rem;
        }

        /* Delete button */
        .delete-btn {
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* ========================================
           STATS SECTION STYLES
           ======================================== */
        .stats {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
        }

        .clear-completed {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .clear-completed:hover {
            text-decoration: underline;
        }

        /* ========================================
           EMPTY STATE STYLES
           ======================================== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state p {
            margin-top: 10px;
        }

        /* ========================================
           RESPONSIVE DESIGN
           ======================================== */
        @media (max-width: 500px) {
            .input-section {
                flex-direction: column;
            }

            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- ========================================
         TODO APP HTML STRUCTURE
         ======================================== -->
    <div class="todo-app">
        <!-- Header -->
        <div class="header">
            <h1>Todo List</h1>
            <p>Stay organized, get things done</p>
        </div>

        <!-- Input section -->
        <div class="input-section">
            <input type="text" class="todo-input" id="todoInput" placeholder="What needs to be done?">
            <button class="add-btn" id="addBtn">Add</button>
        </div>

        <!-- Filter buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Todo list -->
        <div class="todo-list" id="todoList">
            <!-- Todos will be added here by JavaScript -->
        </div>

        <!-- Stats -->
        <div class="stats" id="stats" style="display: none;">
            <span id="itemCount">0 items left</span>
            <button class="clear-completed" id="clearCompleted">Clear completed</button>
        </div>
    </div>

    <!-- ========================================
         JAVASCRIPT - Todo App Logic
         ======================================== -->
    <script>
        // Get DOM elements
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const stats = document.getElementById('stats');
        const itemCount = document.getElementById('itemCount');
        const clearCompleted = document.getElementById('clearCompleted');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Todo array
        let todos = [];
        let currentFilter = 'all';

        // Add todo
        function addTodo() {
            const text = todoInput.value.trim();
            if (text === '') return;

            const todo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            todos.push(todo);
            todoInput.value = '';
            saveTodos();
            renderTodos();
        }

        // Toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
            }
        }

        // Delete todo
        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            renderTodos();
        }

        // Clear completed todos
        function clearCompletedTodos() {
            todos = todos.filter(t => !t.completed);
            saveTodos();
            renderTodos();
        }

        // Filter todos
        function filterTodos(filter) {
            currentFilter = filter;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderTodos();
        }

        // Render todos
        function renderTodos() {
            let filteredTodos = todos;
            
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <p>No todos yet!</p>
                        <p>Add one above.</p>
                    </div>
                `;
            } else {
                todoList.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                        <div class="todo-checkbox" onclick="toggleTodo(${todo.id})"></div>
                        <span class="todo-text">${todo.text}</span>
                        <button class="delete-btn" onclick="deleteTodo(${todo.id})">×</button>
                    </div>
                `).join('');
            }

            // Update stats
            const activeTodos = todos.filter(t => !t.completed).length;
            itemCount.textContent = `${activeTodos} item${activeTodos !== 1 ? 's' : ''} left`;
            
            // Show/hide stats
            stats.style.display = todos.length > 0 ? 'flex' : 'none';
        }

        // Save to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Load from localStorage
        function loadTodos() {
            const saved = localStorage.getItem('todos');
            if (saved) {
                todos = JSON.parse(saved);
            }
        }

        // Event listeners
        addBtn.addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterTodos(btn.dataset.filter);
            });
        });

        clearCompleted.addEventListener('click', clearCompletedTodos);

        // Initial load
        loadTodos();
        renderTodos();
    </script>
</body>
</html>
